<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ทะเบียนน้องค่าย</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: ส่วนหัว + แถบสถานะข้อมูล + สรุปยอด + แถบเครื่องมือ + รายชื่อจัดกลุ่มตามบ้าน + แถบเช็คชื่อลอยด้านล่าง + แผงรายละเอียดด้านขวา. ขาวดำล้วน */
:root {
  --bg: #ffffff;
  --fg: #0a0a0a;
  --mute: #6b6b6b;
  --line: #e2e2e2;
  --soft: #f5f5f5;
  --inv-bg: #0a0a0a;
  --inv-fg: #ffffff;
  --font-body: "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0a0a; --fg: #f5f5f5; --mute: #9a9a9a; --line: #262626; --soft: #141414;
    --inv-bg: #f5f5f5; --inv-fg: #0a0a0a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0a0a; --fg: #f5f5f5; --mute: #9a9a9a; --line: #262626; --soft: #141414;
  --inv-bg: #f5f5f5; --inv-fg: #0a0a0a; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body.has-bar { padding-bottom: 130px; }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.mute { color: var(--mute); }
.small { font-size: 13px; }

/* header */
.top { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; }
.top h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; text-wrap: balance; }
.eyebrow { font-family: var(--font-data); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mute); margin-bottom: 6px; }
.top-r { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
.sess { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.lbl { font-size: 12px; color: var(--mute); }
.sessform { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sessform .field { flex: 1 1 220px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  border: 1px solid var(--fg); background: var(--bg); color: var(--fg);
  padding: 8px 14px; font-size: 14px; font-weight: 500; line-height: 1.2; border-radius: 0;
}
.btn:hover { background: var(--soft); }
.btn.solid { background: var(--inv-bg); color: var(--inv-fg); }
.btn.solid:hover { opacity: 0.86; }
.btn.small { padding: 6px 10px; font-size: 13px; }
.btn[disabled] { opacity: 0.35; cursor: default; }
input[type="file"] { display: none; }

/* data note */
.note { border: 1px solid var(--line); background: var(--soft); padding: 10px 14px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.note b { font-weight: 600; }
.note .acts { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.note .checks { flex-basis: 100%; font-family: var(--font-data); font-size: 12px; color: var(--mute); display: flex; flex-wrap: wrap; gap: 2px 16px; }
.drop-on { outline: 2px dashed var(--fg); outline-offset: 6px; }

/* summary */
.summary { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.facts { display: flex; flex-wrap: wrap; gap: 10px 26px; }
.fact { display: flex; flex-direction: column; }
.fact .n { font-family: var(--font-data); font-size: 28px; font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums; }
.fact .l { font-size: 12px; color: var(--mute); }
.fact.hot { background: var(--inv-bg); color: var(--inv-fg); padding: 4px 12px 6px; }
.fact.hot .l { color: var(--inv-fg); opacity: 0.8; }
.sumL { display: grid; gap: 16px; min-width: 0; }
.hero { border: 2px solid var(--fg); padding: 16px 22px 18px; }
.hero-n { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; font-family: var(--font-data); line-height: 1; font-variant-numeric: tabular-nums; }
.hero-n b { font-size: clamp(72px, 13vw, 120px); font-weight: 500; letter-spacing: -0.02em; }
.hero-n span { font-size: clamp(30px, 5vw, 52px); color: var(--mute); }
.hero-l { font-size: 15px; margin-top: 8px; }
.hbar { height: 6px; background: var(--line); margin-top: 12px; }
.hbar i { display: block; height: 100%; background: var(--fg); }
.facts .fact .sub { font-size: 11.5px; color: var(--mute); font-family: var(--font-data); }
.houses { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.house { padding: 8px 12px 8px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 16px; color: var(--fg); }
.house .hn { flex: 1 1 150px; min-width: 0; font-size: 18px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.house .hs { display: flex; gap: 6px 16px; font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.house .m { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.15; }
.house .m i { font-style: normal; font-family: var(--font-body); font-size: 12px; opacity: 0.75; }
.house .m b { font-size: 22px; font-weight: 500; }
.house .m b small { font-size: 14px; font-weight: 400; opacity: 0.7; }
.house .m.z b { opacity: 0.35; }
.house .hl { flex-basis: 100%; font-size: 12px; opacity: 0.8; font-family: var(--font-data); }
/* สีประจำบ้าน: ใช้ชุดเดียวกันทั้งสรุปยอด หัวกลุ่มในรายชื่อ และตารางรายงาน */
:root { --hsat: 72%; --hsat2: 62%; --hlit: 91%; --hac: 46%; }
.hc { --hbgc: hsl(var(--h, 0) var(--hsat) var(--hlit)); --hbd: hsl(var(--h, 0) var(--hsat2) var(--hac)); }
.house.hc, .gh.hc { background: var(--hbgc); border-left: 8px solid var(--hbd); }
.gh.hc { padding-left: 12px; padding-right: 12px; }
.rt tr.hc td { background: var(--hbgc); }
.rt tr.hc td:first-child { border-left: 8px solid var(--hbd); font-weight: 600; }
.lvg { display: flex; gap: 0; margin-top: 4px; }
.lvg .mini { padding: 2px 9px; min-height: 26px; font-family: var(--font-body); font-size: 12px; }
.lvg .mini + .mini { margin-left: -1px; }
.lvg .mini[aria-pressed="true"] { background: var(--inv-bg); color: var(--inv-fg); font-weight: 600; }
.lvg .mini[disabled] { opacity: 0.4; cursor: default; }
.lvg.big { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 8px; }
.lvg.big .mini { min-height: 38px; font-size: 14px; }
.lvg-t { font-size: 12px; color: var(--mute); margin-top: 10px; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --hsat: 38%; --hsat2: 55%; --hlit: 20%; --hac: 58%; }
}
:root[data-theme="dark"] { --hsat: 38%; --hsat2: 55%; --hlit: 20%; --hac: 58%; }

/* toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-block: 1px solid var(--fg); padding-block: 12px; }
.toolbar .grow { flex: 1 1 200px; min-width: 0; }
.field { border: 1px solid var(--line); background: var(--bg); padding: 7px 10px; border-radius: 0; font-size: 14px; min-width: 0; }
.field:focus { border-color: var(--fg); outline: none; }
select.field { max-width: 100%; }
.chip { border: 1px solid var(--line); background: var(--bg); padding: 6px 11px; font-size: 13px; cursor: pointer; border-radius: 0; }
.chip[aria-pressed="true"] { background: var(--inv-bg); color: var(--inv-fg); border-color: var(--inv-bg); }
.seg { display: inline-flex; }
.seg .chip + .chip { margin-left: -1px; }
.count { font-size: 13px; color: var(--mute); margin-left: auto; font-variant-numeric: tabular-nums; }

/* groups */
.group { margin-top: 20px; }
.group:first-child { margin-top: 6px; }
.gh { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--fg); }
.gtoggle { all: unset; cursor: pointer; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; flex: 1; min-width: 0; }
.gtoggle:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.gtoggle::before { content: "−"; font-family: var(--font-data); width: 14px; flex: none; }
.gtoggle[aria-expanded="false"]::before { content: "+"; }
.gname { font-weight: 600; font-size: 18px; }
.gcount { color: var(--mute); font-size: 13px; }
.gstat { font-family: var(--font-data); font-size: 12px; color: var(--mute); margin-left: auto; }

/* table */
.tablebox { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 860px; }
th { text-align: left; font-weight: 500; font-size: 12px; color: var(--mute); padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: 14px; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--soft); }
tr.sel td { background: var(--soft); }
.who { display: flex; align-items: center; gap: 12px; min-width: 190px; }
.who button { all: unset; cursor: pointer; display: flex; flex-direction: column; min-width: 0; }
.who button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.who .nick { font-weight: 600; }
.who .full { font-size: 12.5px; color: var(--mute); }
.av { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--inv-bg); color: var(--inv-fg); display: grid; place-items: center; font-weight: 600; font-size: 15px; }
.av.lg { width: 60px; height: 60px; font-size: 24px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-family: var(--font-data); font-size: 11px; border: 1px solid var(--fg); padding: 1px 6px; white-space: nowrap; }
.tag.fill { background: var(--inv-bg); color: var(--inv-fg); }
.chk { width: 18px; height: 18px; accent-color: var(--fg); cursor: pointer; }

/* status buttons */
.stg { display: inline-flex; }
.stb { border: 1px solid var(--fg); background: var(--bg); padding: 4px 11px; font-size: 13px; cursor: pointer; border-radius: 0; line-height: 1.3; min-height: 30px; white-space: nowrap; }
.stb + .stb { margin-left: -1px; }
.stb:hover { background: var(--soft); }
.stb[aria-pressed="true"] { background: var(--inv-bg); color: var(--inv-fg); font-weight: 600; }
.stb[disabled] { opacity: 0.4; cursor: default; }
.callc { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.mini { border: 1px solid var(--fg); background: var(--bg); padding: 1px 8px; font-size: 12px; cursor: pointer; border-radius: 0; min-height: 24px; font-family: var(--font-data); }
.mini:hover { background: var(--soft); }
.mini[disabled] { opacity: 0.4; cursor: default; }

/* cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; padding-top: 12px; }
.card { border: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; min-width: 0; }
.card:hover { border-color: var(--fg); }
.card.sel { border-color: var(--fg); background: var(--soft); }
.card .head { display: flex; gap: 12px; align-items: center; min-width: 0; }
.card .head > div { min-width: 0; flex: 1; }
.card .nick { font-weight: 600; }
.card .full { font-size: 12.5px; color: var(--mute); overflow-wrap: anywhere; }
.card .meta { font-size: 13px; color: var(--mute); }
.card .stg { display: grid; grid-template-columns: repeat(3, 1fr); }
.card .stb { min-height: 40px; }
.empty { padding: 48px 0; text-align: center; color: var(--mute); display: grid; gap: 12px; justify-items: center; }
.empty h2 { margin: 0; color: var(--fg); font-size: 20px; }
.empty p { margin: 0; max-width: 46ch; }

/* floating action bar */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--inv-bg); color: var(--inv-fg); padding-top: 12px; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: center; }
.bar .cnt { font-weight: 600; }
.bar .acts { display: flex; flex-wrap: wrap; gap: 6px; }
.bar button { border: 1px solid var(--inv-fg); background: transparent; color: var(--inv-fg); padding: 8px 14px; font-size: 14px; cursor: pointer; border-radius: 0; min-height: 38px; }
.bar button:hover { background: var(--inv-fg); color: var(--inv-bg); }
.bar button[disabled] { opacity: 0.35; cursor: default; }
.bar button[disabled]:hover { background: transparent; color: var(--inv-fg); }
.bar .sep { width: 1px; background: var(--inv-fg); opacity: 0.35; align-self: stretch; }
.bar :focus-visible { outline-color: var(--inv-fg); }

/* detail sheet */
dialog.sheet {
  margin: 0 0 0 auto; padding: 0; border: 0; border-left: 1px solid var(--fg);
  height: 100%; max-height: 100%; width: min(580px, 100%); max-width: 100%;
  background: var(--bg); color: var(--fg);
}
dialog.sheet::backdrop { background: rgba(0, 0, 0, 0.45); }
.sheet-in { display: flex; flex-direction: column; height: 100%; }
.sheet-bar { display: flex; justify-content: space-between; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); padding-top: max(12px, env(safe-area-inset-top, 0px)); }
.sheet-body { overflow-y: auto; padding: 20px 16px 28px; display: flex; flex-direction: column; gap: 20px; flex: 1; padding-bottom: max(28px, env(safe-area-inset-bottom, 0px)); }
.id { display: flex; gap: 14px; align-items: center; }
.id h2 { margin: 0; font-size: 26px; line-height: 1.2; }
.id .fn { margin: 2px 0 0; color: var(--mute); font-size: 15px; overflow-wrap: anywhere; }
.id .sub { margin: 6px 0 0; font-size: 14px; overflow-wrap: anywhere; }
.attbox { border: 1px solid var(--fg); padding: 14px; display: grid; gap: 14px; }
.att-h { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.att-h .t { font-weight: 600; font-size: 16px; }
.big-st { display: grid; grid-template-columns: repeat(3, 1fr); }
.big-st .stb { padding: 14px 8px; font-size: 17px; font-weight: 500; min-height: 56px; }
.callrow { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.callstate { font-size: 15px; }
.callbtns { display: flex; flex-wrap: wrap; gap: 8px; }
.attbox textarea { width: 100%; min-height: 72px; resize: vertical; border: 1px solid var(--line); background: var(--bg); padding: 8px 10px; border-radius: 0; }
.attbox textarea:focus { border-color: var(--fg); outline: none; }
.alert { background: var(--inv-bg); color: var(--inv-fg); padding: 14px; display: grid; gap: 6px; font-size: 15px; }
.alert .t { font-family: var(--font-data); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.75; }
.emer { border: 1px solid var(--line); padding: 14px; display: grid; gap: 4px; }
.emer .en { font-size: 17px; font-weight: 500; overflow-wrap: anywhere; }
.emer .ephrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 4px; }
.emer .ph { font-family: var(--font-data); font-size: 22px; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.k { font-size: 12px; color: var(--mute); }
.kvgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; }
.kv { min-width: 0; }
.kv .v { font-size: 16px; overflow-wrap: anywhere; }
.kv.wide { grid-column: 1 / -1; }
details.dg { border-top: 1px solid var(--fg); }
details.dg > summary { cursor: pointer; padding: 12px 0; font-weight: 500; display: flex; justify-content: space-between; gap: 8px; list-style: none; }
details.dg > summary::-webkit-details-marker { display: none; }
details.dg > summary::after { content: "+"; font-family: var(--font-data); }
details.dg[open] > summary::after { content: "−"; }
details.dg .kvgrid { padding-bottom: 16px; }
.sec-h { font-size: 12px; color: var(--mute); letter-spacing: 0.04em; margin: 0 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--fg); }

/* Read me */
.rm { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
.rm-top { display: flex; flex-wrap: wrap; gap: 12px 16px; justify-content: space-between; align-items: flex-end; }
.rm h1 { margin: 0; font-size: 34px; font-weight: 600; line-height: 1.15; letter-spacing: -0.01em; }
.rm-meta { font-family: var(--font-data); font-size: 12px; color: var(--mute); margin-top: 8px; }
.rm-status { display: flex; flex-wrap: wrap; gap: 10px 32px; border-block: 1px solid var(--fg); padding-block: 14px; }
.rm-status > div { display: flex; flex-direction: column; min-width: 0; }
.rm-status .n { font-family: var(--font-data); font-size: 18px; font-variant-numeric: tabular-nums; }
.rm-status .l { font-size: 12px; color: var(--mute); }
.rm-sec { display: grid; gap: 14px; }
.rm-sec h2 { margin: 0; display: flex; gap: 14px; align-items: baseline; font-size: 20px; font-weight: 600; padding-bottom: 8px; border-bottom: 1px solid var(--fg); line-height: 1.35; }
.rm-sec h2 .no { font-family: var(--font-data); font-size: 13px; font-weight: 400; color: var(--mute); min-width: 38px; flex: none; }
.rm-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 14px; }
.rm-list li { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; align-items: start; }
.rm-list li.nt { grid-template-columns: minmax(0, 1fr); }
.rm-list li .tag { justify-self: start; margin-top: 4px; }
.rm-list .sub { color: var(--mute); font-size: 14px; margin-top: 3px; overflow-wrap: anywhere; }
.rm-steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: st; }
.rm-steps li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; align-items: start; }
.rm-steps li::before { counter-increment: st; content: counter(st); font-family: var(--font-data); font-size: 12px; border: 1px solid var(--fg); width: 24px; height: 24px; display: grid; place-items: center; margin-top: 2px; }
body.v-readme #bar { display: none !important; }
body.v-readme.has-bar { padding-bottom: 56px; }
@media (max-width: 520px) {
  .rm h1 { font-size: 28px; }
  .rm-list li { grid-template-columns: minmax(0, 1fr); gap: 4px; }
}

.toast { position: fixed; left: 50%; transform: translateX(-50%); top: max(16px, env(safe-area-inset-top, 0px)); background: var(--inv-bg); color: var(--inv-fg); padding: 9px 16px; font-size: 14px; z-index: 80; max-width: calc(100% - 32px); }

@media (max-width: 760px) {
  .summary { grid-template-columns: minmax(0, 1fr); }
  .top h1 { font-size: 25px; }
  .count { margin-left: 0; width: 100%; }
  .gstat { margin-left: 0; flex-basis: 100%; }
}
@media (prefers-reduced-motion: no-preference) {
  .btn, .chip, .card, .stb { transition: background 0.12s, border-color 0.12s; }
}

.pg{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.pg h1{margin:0;font-size:30px;font-weight:600;line-height:1.2}
.pgnav{display:flex;flex-wrap:wrap;gap:8px}
.pgnav .btn[aria-current=page]{background:var(--inv-bg);color:var(--inv-fg)}
.clock{font-family:var(--font-data);font-size:44px;font-variant-numeric:tabular-nums;line-height:1}
.rt{width:100%;border-collapse:collapse;font-size:14px}
.rt th,.rt td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right;font-variant-numeric:tabular-nums}
.rt th:first-child,.rt td:first-child{text-align:left}
.rt thead th{border-bottom:1px solid var(--fg);font-weight:500;font-size:12px;color:var(--mute)}
.rt tfoot td{border-top:1px solid var(--fg);font-weight:600}

/* ---------- CSV ---------- */
function detectDelim(line) {
  const c = { ',': 0, ';': 0, '\t': 0 }; let q = false;
  for (const ch of line) { if (ch === '"') q = !q; else if (!q && ch in c) c[ch]++; }
  return Object.keys(c).sort((a, b) => c[b] - c[a])[0];
}
function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const delim = detectDelim(text.split(/\r?\n/)[0] || '');
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
function decode(buf) {
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch (e) { try { return new TextDecoder('windows-874').decode(buf); } catch (e2) { return new TextDecoder('utf-8').decode(buf); } }
}
function csvCell(v) { v = String(v == null ? '' : v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function makePids(headers, rows) {
  const ci = headers.indexOf('รหัสผู้ใช้'); const seen = new Set();
  return rows.map((r, i) => {
    const code = ci >= 0 ? (r[ci] || '').trim() : ''; let pid = '';
    if (/^[A-Za-z0-9_\-.~:@+]{1,100}$/.test(code) && code !== '.' && code !== '..') pid = 'k_' + code;
    if (!pid || seen.has(pid)) pid = 'r_' + String(i + 1).padStart(4, '0');
    seen.add(pid); return pid;
  });
}

/* ---------- small helpers ---------- */
let tt;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2800); }
const chains = new Map();
function enqueue(key, fn) {
  const prev = chains.get(key) || Promise.resolve();
  const next = prev.catch(() => {}).then(fn);
  chains.set(key, next);
  next.then(() => { if (chains.get(key) === next) chains.delete(key); }, () => { if (chains.get(key) === next) chains.delete(key); });
  return next;
}
async function retry(fn) {
  try { return await fn(); }
  catch (e) {
    if (e && (e.code === 'unavailable' || e.code === 'resource_exhausted')) { await new Promise(r => setTimeout(r, 500 + Math.random() * 500)); return await fn(); }
    throw e;
  }
}
async function pool(items, n, fn) {
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => { while (i < items.length) { const it = items[i++]; await fn(it); } }));
}

  return o;
}

async function handleFile(file) {

    if (rows.length < 2) { toast('ไม่พบแถวข้อมูลในไฟล์นี้'); return; }
    const headers = rows[0].map(h => h.trim());
    const raw = rows.slice(1), pids = makePids(headers, raw);
    const people = raw.map((r, i) => { const d = {}; headers.forEach((h, j) => d[h] = (r[j] || '').trim()); return { pid: pids[i], d }; });
    S.override = { kind: S.db ? 'draft' : 'local', people, headers, fname: file.name, missing: HEAD.filter(h => !headers.includes(h)) };
    S.localAtt = {}; S.sel.clear(); resetFilters(); buildOptions(); render();
    toast('อ่านไฟล์แล้ว ' + people.length + ' คน');
  } catch (e) { toast('อ่านไฟล์ไม่สำเร็จ ลองบันทึกเป็น CSV UTF-8 อีกครั้ง'); }
}
function draftChecks(o) {
  const P = o.people, codes = Object.create(null), names = Object.create(null);
  let dupC = 0, dupN = 0, noName = 0, noHouse = 0, noEm = 0;
  P.forEach(p => {
    const c = g(p, 'รหัสผู้ใช้'); if (c) { if (codes[c]) dupC++; codes[c] = 1; }
    const nm = fullName(p).toLowerCase();
    if (nm === '(ไม่มีชื่อ)') noName++; else { if (names[nm]) dupN++; names[nm] = 1; }
    if (!g(p, 'น้องบ้าน')) noHouse++;

  });
  const out = ['ตรวจไฟล์: ' + P.length + ' แถว', 'รหัสผู้ใช้ซ้ำ ' + dupC, 'ชื่อซ้ำ ' + dupN, 'ไม่มีชื่อ ' + noName, 'ไม่มีน้องบ้าน ' + noHouse, 'ไม่มีเบอร์ฉุกเฉิน ' + noEm];
  if (o.missing && o.missing.length) out.push('ไม่พบคอลัมน์: ' + o.missing.join(', '));
  return '<div class="checks">' + out.map(x => '<span>' + esc(x) + '</span>').join('') + '</div>';

async function commitDraft() {
  const o = S.override;

  const batch = 'b' + Date.now().toString(36);
  const items = o.people.map((p, i) => ({ id: batch + '-' + p.pid, data: { b: batch, pid: p.pid, n: i, v: o.headers.map(h => p.d[h] || '') } }));
  let done = 0, failed = 0, denied = false;
  S.busy = 'กำลังบันทึกรายชื่อ 0/' + items.length; renderNote();
  await pool(items, 6, async it => {
    try { await retry(() => S.db.collection('people').doc(it.id).set(it.data)); }
    catch (e) { failed++; if (e && e.code === 'invalid_argument') denied = true; }
    done++; S.busy = 'กำลังบันทึกรายชื่อ ' + done + '/' + items.length; renderNote();
  });
  if (failed) {
    S.busy = ''; render();
    toast(denied ? 'บัญชีนี้ไม่มีสิทธิ์บันทึกรายชื่อ ต้องเป็น Editor ขึ้นไป' : 'บันทึกไม่ครบ ' + failed + ' แถว ลองกดบันทึกอีกครั้ง');

    await retry(() => S.db.doc('meta/schema').set({ headers: o.headers, batch, fname: o.fname, count: items.length, at: Date.now() }));
  } catch (e) { S.busy = ''; render(); toast('บันทึกไม่สำเร็จ ลองกดบันทึกอีกครั้ง'); return; }
  const old = S.rawPeople.filter(x => x.b !== batch);
  S.override = null; S.busy = ''; S.sel.clear(); resetFilters(); buildOptions(); render();
  toast('บันทึก ' + items.length + ' คนเข้าระบบแล้ว');

function uniq(k) {

}

function passStatus(p) {
  const f = S.status; if (!f) return true;
  const st = stOf(p.pid);
  if (f === 'none') return !st;
  if (f === 'follow') return st === 'absent' && !callsOf(p.pid).length;

  return st === f;
}
function filtered() {
  const q = S.q.trim().toLowerCase();
  return V().people.filter(p => {
    if (S.region && g(p, 'ภูมิภาค') !== S.region) return false;
    if (S.level && g(p, 'ระดับชั้น') !== S.level) return false;
    if (S.house && g(p, 'น้องบ้าน') !== S.house) return false;
    if (S.alert && !flags(p).length) return false;
    if (S.bday && !isYes(g(p, 'เกิดวันค่าย'))) return false;
    if (!passStatus(p)) return false;
    if (q) {
      const hay = [fullName(p), g(p, 'ชื่อเล่น'), g(p, 'ชื่อจริง'), g(p, 'นามสกุล'), g(p, 'ชื่อสถานศึกษา'), g(p, 'phone'), g(p, 'อีเมล'), g(p, 'รหัสผู้ใช้')].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}
function sortName(a, b) {
  return g(a, 'ชื่อจริง').localeCompare(g(b, 'ชื่อจริง'), 'th') || g(a, 'นามสกุล').localeCompare(g(b, 'นามสกุล'), 'th') || nick(a).localeCompare(nick(b), 'th');
}
function gkey(p) {
  switch (S.group) {
    case 'house': return g(p, 'น้องบ้าน') || 'ไม่ระบุบ้าน';
    case 'level': return g(p, 'ระดับชั้น') || 'ไม่ระบุชั้น';
    case 'region': return g(p, 'ภูมิภาค') || 'ไม่ระบุภูมิภาค';
    case 'status': return ST[stOf(p.pid)];
  }
  return '';
}
function groupList(list) {
  if (S.group === 'none') return [['', list.slice().sort(sortName)]];
  const m = new Map();
  list.forEach(p => { const k = gkey(p); if (!m.has(k)) m.set(k, []); m.get(k).push(p); });
  let keys = [...m.keys()];
  if (S.group === 'status') {
    const rank = k => Number(Object.keys(ST).find(x => ST[x] === k) !== undefined ? ST_RANK[Object.keys(ST).find(x => ST[x] === k)] : 9);
    keys.sort((a, b) => rank(a) - rank(b));
  } else keys.sort((a, b) => (a.startsWith('ไม่ระบุ') - b.startsWith('ไม่ระบุ')) || a.localeCompare(b, 'th', { numeric: true }));
  return keys.map(k => [k, m.get(k).sort(sortName)]);
}

async function copyText(text, okMsg) {

  }
}

function renderReadme() {
  const R = README;
  const people = S.db && S.loaded ? S.dbPeople.length + ' คน' : '—';
  const role = !S.db ? '—' : S.canEdit ? 'Editor ขึ้นไป' : S.readOnly ? 'ดูอย่างเดียว' : 'Contributor';
  const dbs = S.db ? (S.loaded ? 'เชื่อมต่อแล้ว' : 'กำลังเชื่อม') : (S.loaded ? 'ไม่ได้เชื่อม (โหมดทดลอง)' : 'กำลังเชื่อม');
  const li = it => '<li' + (it.tag ? '' : ' class="nt"') + '>' + (it.tag ? '<span class="tag' + (it.hot ? ' fill' : '') + '">' + esc(it.tag) + '</span>' : '') +
    '<div><div>' + esc(it.t) + '</div>' + (it.sub || []).map(s => '<div class="sub">' + esc(s) + '</div>').join('') + '</div></li>';
  let h = '<header class="rm-top"><div><div class="eyebrow">Read me · Update</div><h1>ทะเบียนน้องค่าย</h1><div class="rm-meta">อัปเดตล่าสุด ' + esc(R.updated) + ' · ' + esc(R.version) + '</div></div>' +
    '<button class="btn solid" type="button" data-go="roster">เริ่มใช้งาน</button></header>';
  h += '<div class="rm-status">' + [['ที่เก็บข้อมูล', dbs], ['รายชื่อในระบบ', people], ['รอบเช็คชื่อ', S.sessions.length + ' รอบ'], ['สิทธิ์ของคุณ', role]]
    .map(([l, n]) => '<div><span class="n">' + esc(n) + '</span><span class="l">' + esc(l) + '</span></div>').join('') + '</div>';
  h += '<section class="rm-sec"><h2><span class="no">วิธีใช้</span>เริ่มอย่างไร</h2><ol class="rm-steps">' + R.steps.map(s => '<li><div>' + esc(s) + '</div></li>').join('') + '</ol>' +
    '<p class="mute small" style="margin:0">ทางลัด: ลองต่อท้ายลิงก์ของหน้านี้ด้วย #roster เพื่อเปิดหน้าทะเบียนทันที</p></section>';
  R.sections.forEach(sec => {
    h += '<section class="rm-sec"><h2><span class="no">' + esc(sec.no) + '</span>' + esc(sec.title) + '</h2><ul class="rm-list">' + sec.items.map(li).join('') + '</ul></section>';
  });
  h += '<div><button class="btn solid" type="button" data-go="roster">เริ่มใช้งาน</button></div>';
  $('readme').innerHTML = h;
}
function routeName() { let h = ''; try { h = (location.hash || '').replace(/^#/, ''); } catch (e) {} return ['roster', 'report', 'leave'].includes(h) ? h : 'readme'; }
function showPage(p, push) {
  S.page = p;
  $('app').hidden = p !== 'roster'; ['readme', 'report', 'leave'].forEach(k => $(k).hidden = p !== k);
  document.body.classList.toggle('v-readme', p !== 'roster');
  if (p === 'readme') renderReadme();
  if (p === 'leave') { S.leaveShell = false; }
  renderExtra();
  window.scrollTo(0, 0);
}
